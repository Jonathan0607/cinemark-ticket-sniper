name: watch
on:
  schedule:
    # Offset from :00/:30 on purpose: GitHub sheds scheduled runs at peak minutes.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Fire a test alert instead of sweeping (verifies the Discord webhook channel)"
        type: boolean
        default: false

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npx playwright install --with-deps chromium

      - name: Test alert
        if: inputs.test_alert
        run: >-
          ./notify-hook "Test alert"
          "The Discord webhook channel works. A real alert reads 'Seats open 2026-08-08
          7:00pm, F11-F12'."

      - name: Run sweep
        if: ${{ !inputs.test_alert }}
        run: python3 watch.py --once

      - name: Persist state
        run: |
          git config user.name "odyssey-watcher[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state.json alerts.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: sweep $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main || true
            git push
          fi
